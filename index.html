<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swordmaister's Apps</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700&family=Poppins:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="background-animation"></div>
    <div class="container">
        <header>
            <h1>Applications</h1>
            <p>アプリコレクション ✨</p>
        </header>
        <main id="app-grid">
            <!-- bonus: 計算機P -->
            <a href="https://swordmaister.github.io/bonus/" target="_blank" class="card">
                <div class="card-content">
                    <div class="icon-box color-1">
                        <i class="fas fa-calculator"></i>
                    </div>
                    <h2>計算機P</h2>
                    <p>ポイント収益をサクッと計算</p>
                </div>
                <div class="card-action">
                    <span class="action-text">OPEN</span>
                    <i class="fas fa-external-link-alt"></i>
                </div>
            </a>

            <!-- paceOfAging: Pace of Aging -->
            <a href="https://swordmaister.github.io/paceOfAging" target="_blank" class="card">
                <div class="card-content">
                    <div class="icon-box color-2">
                        <i class="fas fa-heartbeat"></i>
                    </div>
                    <h2>Pace of Aging</h2>
                    <p>あなたの老化速度、測ってみる？</p>
                </div>
                <div class="card-action">
                    <span class="action-text">OPEN</span>
                    <i class="fas fa-external-link-alt"></i>
                </div>
            </a>

            <!-- 7rings: サイコロ -->
            <a href="https://swordmaister.github.io/7rings/" target="_blank" class="card">
                <div class="card-content">
                    <div class="icon-box color-3">
                        <i class="fas fa-dice"></i>
                    </div>
                    <h2>サイコロ</h2>
                    <p>運命を決めるデジタルサイコロ</p>
                </div>
                <div class="card-action">
                    <span class="action-text">OPEN</span>
                    <i class="fas fa-external-link-alt"></i>
                </div>
            </a>

            <!-- etherClock: Ether Clock -->
            <a href="https://swordmaister.github.io/etherClock" target="_blank" class="card">
                <div class="card-content">
                    <div class="icon-box color-4">
                        <i class="fas fa-clock"></i>
                    </div>
                    <h2>Ether Clock</h2>
                    <p>あの頃と今の、時間の速さの違い</p>
                </div>
                <div class="card-action">
                    <span class="action-text">OPEN</span>
                    <i class="fas fa-external-link-alt"></i>
                </div>
            </a>

            <!-- fastFood-: 食卓のお供 -->
            <a href="https://swordmaister.github.io/fastFood-" target="_blank" class="card">
                <div class="card-content">
                    <div class="icon-box color-5">
                        <i class="fas fa-utensils"></i>
                    </div>
                    <h2>食卓のお供</h2>
                    <p>毎日の食事と栄養バランスをチェック</p>
                </div>
                <div class="card-action">
                    <span class="action-text">OPEN</span>
                    <i class="fas fa-external-link-alt"></i>
                </div>
            </a>

            <!-- lifeMoney: Life Style Pricer -->
            <a href="https://swordmaister.github.io/lifeMoney" target="_blank" class="card">
                <div class="card-content">
                    <div class="icon-box color-6">
                        <i class="fas fa-money-bill-wave"></i>
                    </div>
                    <h2>Life Style Pricer</h2>
                    <p>理想の生活、いくら必要？</p>
                </div>
                <div class="card-action">
                    <span class="action-text">OPEN</span>
                    <i class="fas fa-external-link-alt"></i>
                </div>
            </a>
        </main>
        <footer>
            <p>&copy; 2023 Swordmaister</p>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
